<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100%" height="100%">
  <defs>
    <linearGradient id="nohaGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#818cf8" />
      <stop offset="100%" stop-color="#c084fc" />
    </linearGradient>
    <linearGradient id="groqAccent" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f97316" />
      <stop offset="100%" stop-color="#fbbf24" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  
  <!-- Outer Antigravity Hex/Ring -->
  <rect x="6" y="6" width="88" height="88" rx="22" fill="#0d1117" stroke="url(#nohaGrad)" stroke-width="2.5" />
  
  <!-- Subtle Grid Accent -->
  <circle cx="50" cy="50" r="34" fill="none" stroke="#1f2937" stroke-width="1.5" stroke-dasharray="3 3" />
  
  <!-- Stylized "N" Letter with AI Spark Nodes -->
  <path d="M30 70 L30 30 L45 30 L65 65 L65 30 L73 30 L73 70 L58 70 L38 35 L38 70 Z" 
        fill="url(#nohaGrad)" filter="url(#glow)" />
        
  <!-- Groq LPU Speed Bolt / Spark in upper right -->
  <path d="M68 20 L62 31 L68 31 L60 44 L76 30 L69 30 Z" fill="url(#groqAccent)" />
  
  <!-- Orbiting Nodes -->
  <circle cx="30" cy="30" r="3.5" fill="#38bdf8" />
  <circle cx="73" cy="70" r="3.5" fill="#c084fc" />
  <circle cx="50" cy="50" r="2.5" fill="#ffffff" />
</svg>
